<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原点 · 教师看板</title>
  <link rel="stylesheet" href="/static/css/style.css?v=8" />
</head>
<body class="teacher-page">
  <main class="teacher-shell">
    <header class="app-header teacher-header"><a class="brand-lockup" href="/">YUAN<span>点</span><small>教师看板</small></a><div class="header-actions"><span id="teacherIdentity" class="session-id"></span><button id="refreshBtn" class="button button-quiet">刷新数据</button><a class="text-link" href="/">学生端 →</a></div></header>
    <section class="teacher-login" id="loginView"><div class="eyebrow">教师工作台</div><h1>看见班级<br /><em>真正卡住的地方。</em></h1><p>用全班的证据，决定下一节课该教什么。</p><form id="loginForm" class="access-form"><label>教师账号<input id="teacherUsername" required placeholder="teacher1" /></label><label>密码<input id="teacherPassword" required type="password" placeholder="••••••••" /></label><button class="button button-primary" type="submit">查看班级数据 <span>↗</span></button><p class="form-error" id="loginError"></p></form></section>
    <section class="dashboard hidden" id="dashboardView">
      <div class="dashboard-intro"><div><div class="eyebrow">班级脉搏</div><h1>今天，哪里最需要介入？</h1></div><span id="lastUpdate" class="session-id"></span></div>
      <div class="metric-grid"><div class="metric"><span>有效项目</span><strong id="totalTeams">—</strong></div><div class="metric metric-alert"><span>高风险项目</span><strong id="highRiskCount">—</strong></div><div class="metric metric-good"><span>持续进步</span><strong id="improvingCount">—</strong></div><div class="metric"><span>班级进步率</span><strong id="improvementRate">—</strong></div></div>
      <div class="dashboard-grid"><section class="dashboard-card recommendation-card"><div class="card-kicker">教学建议</div><h2>下一个 45 分钟，讲什么？</h2><div id="suggestionsList" class="suggestions-list"><p class="empty-state">登录后加载数据。</p></div></section><section class="dashboard-card phase-card"><div class="card-kicker">项目分布</div><h2>大家现在在哪一站？</h2><div id="phaseDistribution" class="distribution-list"></div></section></div>
      <section class="dashboard-card teams-card"><div class="table-head"><div><div class="card-kicker">项目列表</div><h2>逐个项目看进度</h2></div><input id="teamSearch" class="search-input" placeholder="搜索学生或规则" /></div><div class="team-table-wrap"><table><thead><tr><th>项目</th><th>阶段</th><th>轮次</th><th>风险</th><th>能力均分</th></tr></thead><tbody id="teamTableBody"><tr><td colspan="5" class="empty-state">暂无数据</td></tr></tbody></table></div></section>
    </section>
  </main>
  <script src="/static/js/teacher.js?v=8"></script>
</body>
</html>
