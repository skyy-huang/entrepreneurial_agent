<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原点 · 创业诊断工作台</title>
  <link rel="stylesheet" href="/static/css/style.css?v=8" />
</head>
<body class="student-page">
  <main class="student-shell">
    <section class="welcome-panel" id="welcomePanel">
      <div class="brand-mark">YUAN<span>点</span></div>
      <div class="eyebrow">创业项目诊断工作台</div>
      <h1>把一个想法，<br /><em>变成可验证的假设。</em></h1>
      <p class="welcome-copy">这里不替你写漂亮的商业计划书。它会帮你找出最危险的逻辑缺口，并把下一步变成一件今天就能完成的事。</p>
      <form class="access-form" id="accessForm">
        <label>你的名字或学号<input id="studentIdInput" required maxlength="50" autocomplete="username" placeholder="例如：张三 / 20250101" /></label>
        <label>访问密码<input id="studentPasswordInput" required maxlength="50" type="password" autocomplete="current-password" placeholder="首次使用会自动创建账号" /></label>
        <button class="button button-primary" id="startBtn" type="submit">进入工作台 <span>↗</span></button>
        <p class="form-error" id="accessError"></p>
      </form>
      <div class="welcome-footer"><span>学生工作台</span><a href="/teacher">教师看板 →</a></div>
    </section>

    <section class="workspace hidden" id="workspace">
      <header class="app-header">
        <a class="brand-lockup" href="/">YUAN<span>点</span><small>创业诊断</small></a>
        <div class="header-context"><span class="status-dot"></span><span id="phaseLabel">价值探测</span><span class="header-divider"></span><span>第 <strong id="roundCount">0</strong> 轮</span></div>
        <div class="header-actions"><span class="session-id" id="sessionInfo"></span><button class="icon-button" id="newSessionBtn" title="新建项目">＋<span>新项目</span></button><a class="text-link" href="/teacher">教师看板</a></div>
      </header>

      <div class="workspace-grid">
        <aside class="project-rail">
          <div class="rail-heading"><span>我的项目</span><button id="railNewBtn" class="rail-add" title="新建项目">＋</button></div>
          <div id="historyList" class="history-list"><div class="rail-empty">登录后，你的项目会出现在这里。</div></div>
          <div class="rail-note"><span class="status-dot"></span><div><strong>诊断原则</strong><p>一次只解决一个<br />最关键的假设。</p></div></div>
        </aside>

        <section class="conversation-panel">
          <div class="conversation-head"><div><div class="eyebrow">当前诊断</div><h2 id="projectTitle">新项目</h2></div><span class="phase-pill" id="phasePill">价值探测</span></div>
          <div class="messages" id="messagesWrap"></div>
          <form class="composer" id="composerForm">
            <textarea id="userInput" rows="3" maxlength="3000" placeholder="描述你的项目：谁遇到了什么问题？你打算怎么解决？"></textarea>
            <div class="composer-footer"><span>Enter 换行 · Ctrl + Enter 发送</span><button class="button button-primary send-button" id="sendBtn" type="submit">发送 <span>↗</span></button></div>
          </form>
        </section>

        <aside class="insight-rail">
          <div class="insight-section"><div class="section-label">能力画像 <span>0—10</span></div><div id="scoresGrid" class="score-list"></div></div>
          <div class="insight-section"><div class="section-label">当前行动</div><div class="action-card" id="taskCard"><span class="action-index">NEXT</span><p id="taskText">完成第一轮描述后，这里会出现一个明确动作。</p></div></div>
          <div class="insight-section"><div class="section-label">逻辑缺口 <span id="fallacyCount">0</span></div><div id="fallaciesList" class="risk-list"><p class="empty-state">还没有诊断结果。</p></div></div>
          <div class="insight-foot">原点会优先处理<br /><strong>最影响项目生死的证据。</strong></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="/static/js/student.js?v=8"></script>
</body>
</html>
